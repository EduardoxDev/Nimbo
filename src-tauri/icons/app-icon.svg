<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5ff0"/>
      <stop offset="0.55" stop-color="#3a3fc2"/>
      <stop offset="1" stop-color="#23268a"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d26"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#sky)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#glow)"/>
  <!-- The island -->
  <rect x="172" y="372" width="680" height="200" rx="100" fill="url(#pill)"/>
  <rect x="172" y="372" width="680" height="200" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
  <!-- Status ring -->
  <circle cx="290" cy="472" r="46" fill="none" stroke="#35e985" stroke-width="22"/>
  <!-- Level bars -->
  <rect x="620" y="440" width="26" height="64" rx="13" fill="#ffffff"/>
  <rect x="668" y="412" width="26" height="120" rx="13" fill="#ffffff"/>
  <rect x="716" y="452" width="26" height="40" rx="13" fill="#ffffff"/>
  <rect x="380" y="456" width="190" height="32" rx="16" fill="#ffffff" fill-opacity="0.85"/>
</svg>
