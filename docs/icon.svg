<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Nimbo</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14151c"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <!-- The sphere: deep navy, warming to magenta at the bottom right -->
    <radialGradient id="sphere" cx="0.68" cy="0.72" r="0.75">
      <stop offset="0" stop-color="#6f2766"/>
      <stop offset="0.35" stop-color="#3a1940"/>
      <stop offset="0.7" stop-color="#16152b"/>
      <stop offset="1" stop-color="#0d0e1d"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7b80e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b80e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#dfe3ff"/>
      <stop offset="0.5" stop-color="#b4b4e6"/>
      <stop offset="1" stop-color="#c9b6e6"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4ff"/>
      <stop offset="1" stop-color="#c9cdea"/>
    </linearGradient>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="twinkle" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="inside">
      <circle cx="512" cy="512" r="268"/>
    </clipPath>
  </defs>

  <!-- Night sky -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#night)"/>

  <!-- Colour haze around the orb: violet left, teal right, pink below -->
  <g filter="url(#haze)">
    <circle cx="372" cy="600" r="200" fill="#7c5cff" opacity="0.8"/>
    <circle cx="700" cy="520" r="190" fill="#36c9c2" opacity="0.55"/>
    <circle cx="640" cy="680" r="170" fill="#c2449e" opacity="0.6"/>
    <circle cx="430" cy="360" r="170" fill="#8f96ff" opacity="0.5"/>
    <circle cx="660" cy="340" r="140" fill="#6f7cff" opacity="0.35"/>
  </g>

  <!-- The orb -->
  <circle cx="512" cy="512" r="286" fill="url(#sphere)"/>
  <g clip-path="url(#inside)">
    <circle cx="512" cy="512" r="286" fill="url(#sheen)"/>
    <ellipse cx="470" cy="520" rx="170" ry="150" fill="#05060f" opacity="0.35" filter="url(#haze)"/>
  </g>
  <!-- Glass rim: a soft glow, then the translucent ring -->
  <circle cx="512" cy="512" r="286" fill="none" stroke="#b9bdf5" stroke-width="56" opacity="0.35" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="286" fill="none" stroke="url(#ring)" stroke-width="34" opacity="0.62"/>
  <circle cx="512" cy="512" r="269" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.18"/>

  <!-- Eyes -->
  <rect x="336" y="372" width="68" height="180" rx="34" fill="url(#eye)" opacity="0.92"/>
  <rect x="476" y="372" width="68" height="180" rx="34" fill="url(#eye)" opacity="0.92"/>

  <!-- Little stars -->
  <g fill="#9cc2ff">
    <circle cx="824" cy="214" r="16" opacity="0.5" filter="url(#twinkle)"/>
    <circle cx="824" cy="214" r="7"/>
    <circle cx="204" cy="690" r="13" opacity="0.5" filter="url(#twinkle)"/>
    <circle cx="204" cy="690" r="5.5"/>
    <circle cx="756" cy="872" r="13" opacity="0.5" filter="url(#twinkle)"/>
    <circle cx="756" cy="872" r="6"/>
    <circle cx="410" cy="150" r="3.5" opacity="0.7"/>
    <circle cx="690" cy="808" r="3.5" opacity="0.7"/>
    <circle cx="300" cy="858" r="3" opacity="0.6"/>
  </g>
</svg>
